name: Python SDK CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build twine uv
      - run: python -m pytest
      - run: ruff check dnscale tests && ruff format --check dnscale tests
      - run: bash scripts/generate.sh && git diff --exit-code -- dnscale_api
      - run: python -m build && python -m twine check dist/*
      - run: |
          python -m venv /tmp/sdk-wheel
          /tmp/sdk-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sdk-wheel/bin/python -c 'from dnscale import DNScale; from dnscale_api.api.zones import list_zones'
