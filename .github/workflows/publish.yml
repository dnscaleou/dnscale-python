name: Publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed version tag (v0.1.0)
        required: true
      target:
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + v'
      - run: python -m pip install -e '.[dev]' build twine uv
      - run: bash scripts/generate.sh && git diff --exit-code -- dnscale_api
      - run: python -m pytest && ruff check dnscale tests && ruff format --check dnscale tests
      - run: python -m build && python -m twine check dist/*
      - name: Install built wheel
        run: |
          python -m venv /tmp/sdk-wheel
          /tmp/sdk-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sdk-wheel/bin/python -c 'from dnscale import DNScale'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
