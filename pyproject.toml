[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dnscale-sdk"
version = "0.1.0"
description = "Official Python SDK for the DNScale API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DNScale", email = "ops@dnscale.eu" },
]
keywords = ["dns", "dnscale", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "attrs>=22.2.0",
  "httpx>=0.23.0,<0.29.0",
  "python-dateutil>=2.8.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "ruff>=0.12.0,<0.13",
]

[project.urls]
Documentation = "https://docs.dnscale.eu"
Homepage = "https://dnscale.eu"
Repository = "https://github.com/dnscaleou/dnscale"

[tool.setuptools.packages.find]
where = ["."]
include = ["dnscale", "dnscale.*", "dnscale_api", "dnscale_api.*"]

[tool.setuptools.package-data]
dnscale = ["py.typed"]
dnscale_api = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
